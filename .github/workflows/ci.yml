name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  validate-tag:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate release tag and main ancestry
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python scripts/check-release-tag.py --tag "$RELEASE_TAG"
          git merge-base --is-ancestor HEAD refs/remotes/origin/main || {
            echo "Release tags must point to a commit already merged into main." >&2
            exit 1
          }
  test:
    needs: validate-tag
    if: always() && (needs.validate-tag.result == 'success' || needs.validate-tag.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils
      - run: python -m pip install build pytest uv
      - run: >-
          python -m pip install
          -e packages/ac-jobs
          -e "packages/ac-llm[test]"
          -e packages/ac-document
          -e packages/ac-proposer-reviewer
      - run: python -m pytest --import-mode=importlib packages/*/tests tests
      - run: node tests/test_dsh_llm_bridge.mjs
      - run: scripts/build-packages.sh
